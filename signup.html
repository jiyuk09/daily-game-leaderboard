<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sign Up</title>
    <meta name="description" content="Leaderboard for daily puzzle games.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!--Favicon-->
    <link rel="icon" type="image/x-icon" href="Images/logo.png">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-left">
                <a href="index.html"><img src="Images/logo.jpg" alt="Logo" class="logo"></a>
            </div>

            <div class="nav-right" id="navRightMenu">
                <a href="search.html" class="nav-link pill-btn">Search</a>
                <a href="contacts.html" class="nav-link pill-btn">Contacts</a>
                <a href="signup.html" class="nav-link pill-btn">Sign Up</a>
                <a href="login.html" class="nav-link pill-btn">Log In</a>
            </div>
            
            <div class="menu-container" id="menu" onclick="myFunction(this)">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Create Account</h1>
        <div class="form-card-container">
            <div class="card auth-card">
                <!--Username Field-->
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="CoolGamer123" class="auth-input" oninput="clearError('username')">
                <small id="usernameError" class="field-error"></small>

                <!--Email Field-->
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="you@example.com" class="auth-input" oninput="clearError('email')">
                <small id="emailError" class="field-error"></small>

                <!--Password Field-->
                <label for="password">Password:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="At least 6 characters" class="auth-input" oninput="clearError('password')">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('password', this)"></i>
                </div>
                <small id="passwordError" class="field-error"></small>

                <button onclick="handleSignup()" class="pill-btn auth-btn">Sign Up</button>
                <p id="generalMessage" class="auth-message"></p>
                <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Daily Game Leaderboard. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        function togglePasswordVisibility(fieldId, icon) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                field.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorElement = document.getElementById(fieldId + 'Error');
            field.classList.add('input-error');
            errorElement.innerText = message;
        }

        function clearError(fieldId) {
            const field = document.getElementById(fieldId);
            const errorElement = document.getElementById(fieldId + 'Error');
            field.classList.remove('input-error');
            errorElement.innerText = '';
        }

        async function handleSignup() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const generalMsg = document.getElementById('generalMessage');

            generalMsg.innerText = '';
            let hasError = false;

            if (!username || username.length < 3) {
                showError('username', 'Username must be at least 3 characters.');
                hasError = true;
            } else {
                const { data: existingUser } = await _supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .single();

                if (existingUser) {
                    showError('username', 'This username is already taken. Please choose another.');
                    hasError = true;
                }
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('email', 'Please enter a valid email address.');
                hasError = true;
            }

            if (!password || password.length < 6) {
                showError('password', 'Password must be at least 6 characters.');
                hasError = true;
            }

            if (hasError) return;

            generalMsg.style.color = '#333';
            generalMsg.innerText = 'Creating account...';

            const { data, error } = await _supabase.auth.signUp({ email, password });
            if (error) {
                generalMsg.style.color = '#d9534f';
                generalMsg.innerText = error.message;
                return;
            }

            const userId = data.user.id;
            const { error: profileError } = await _supabase.from('profiles').insert([{ id: userId, username }]);
            
            if (profileError) {
                generalMsg.style.color = '#d9534f';
                generalMsg.innerText = 'Error saving profile username: ' + profileError.message;
            } else {
                generalMsg.style.color = '#5cb85c';
                generalMsg.innerText = 'Success! Check your email to verify, then log in.';
            }
        }
    </script>
</body>
</html>
